name: 想要个功能
description: 你觉得缺什么 / 哪里不好用
title: '[功能] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        说清楚"你想干什么"比"你想加什么按钮"有用得多 —— 需求我能听懂，
        实现方式我自己会找。也欢迎先说一句你现在的做法是怎么绕过去的。

  - type: textarea
    id: want
    attributes:
      label: 你想干什么
      description: 用你自己的话描述场景就行。
    validations:
      required: true

  - type: textarea
    id: now
    attributes:
      label: 现在你是怎么做的
      description: 如果现在有办法绕过去，说一下；没有就说没有。
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法（可选）
    validations:
      required: false
