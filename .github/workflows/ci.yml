name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 这个项目零第三方依赖：没有 npm install，也不用构建。
      - name: 单元测试（引擎与架构）
        run: node tests/run.mjs

      - name: 接口测试（HTTP 端到端）
        run: node tests/api-test.mjs

      # 前端冒烟（无头浏览器点一遍所有视图）跑不了 CI：它在本机的 work/ 目录里，
      # 而 work/ 不进仓库（草稿区）。要跑就在本地跑：node work/ui-smoke.mjs
