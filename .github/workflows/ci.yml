name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 这个项目零第三方依赖：没有 npm install，也不用构建。
      - name: 单元测试（引擎与架构）
        run: node tests/run.mjs

      - name: 接口测试（HTTP 端到端）
        run: node tests/api-test.mjs

      # 前端冒烟：自带精简 DOM，把 40 个视图挨个挂一遍，纯 Node、不需要浏览器。
      # （以前它在 work/ 里、不进仓库，所以 CI 跑不了 —— 现在收进 tests/ 了。）
      - name: 前端冒烟（视图挂载）
        run: node tests/ui-smoke.mjs
